name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@77d60a821d037aaed948a4770590edf79faf0965
  renovate:
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@77d60a821d037aaed948a4770590edf79faf0965
    with:
      config-file: renovate-config.json
  rulesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python scripts/reconcile-rulesets.py --validate
      - run: python -m unittest discover -s tests -v
