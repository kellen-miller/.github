name: Rulesets
'on':
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ 'CI' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ruleset-paths:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@75c70f9d5db7117810669e0af01fd2eafdc396c6
        with:
          filters: |-
            {
              "rulesets": [
                "rulesets/**",
                ".github/ruleset-requirements.json",
                "scripts/**",
                "tests/**",
                ".github/workflows/**",
                ".python-version",
                "pyproject.toml",
                "uv.lock"
              ]
            }
    name: Rulesets source changes
  ruleset-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - run: python scripts/reconcile-rulesets.py --validate
      - run: python -m unittest discover -s tests -v
    needs: ruleset-paths
    if: ${{ !cancelled() && (needs.ruleset-paths.result != 'success' || fromJSON(needs.ruleset-paths.outputs.changes).rulesets) }}
    name: Configuration validation and Python tests
