name: Reconcile rulesets
on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes instead of previewing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reconcile-rulesets
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check App configuration
        env:
          APP_ID: ${{ vars.RULESETS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Set RULESETS_APP_ID and RULESETS_APP_PRIVATE_KEY; see README.md.'
            exit 1
          fi
      - name: Create account-scoped token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RULESETS_APP_ID }}
          private-key: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
          owner: kellen-miller
          permission-administration: write
      - name: Preview or apply
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || (github.event_name == 'schedule' && vars.RULESETS_APPLY_ENABLED == 'true') }}
        run: |
          args=(--report rulesets-report.txt)
          if [[ "$APPLY" == true ]]; then
            args+=(--apply)
          fi
          python scripts/reconcile-rulesets.py "${args[@]}"
