name: Reconcile rulesets
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes instead of previewing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reconcile-rulesets
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check App configuration
        env:
          APP_ID: ${{ vars.RULESETS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Set RULESETS_APP_ID and RULESETS_APP_PRIVATE_KEY; see README.md.'
            exit 1
          fi
      - name: Create account-scoped token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RULESETS_APP_ID }}
          private-key: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
          owner: kellen-miller
          permission-administration: write
      - name: Preview or apply
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || (github.event_name == 'schedule' && vars.RULESETS_APPLY_ENABLED == 'true') }}
        run: |
          args=(--report rulesets-report.txt)
          if [[ "$APPLY" == true ]]; then
            args+=(--apply)
          fi
          python scripts/reconcile-rulesets.py "${args[@]}"
